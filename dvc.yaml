# Dependencias por subruta y no por directorio `src` completo.
#
# Con `deps: - src`, cualquier cambio en src/api invalidaba el entrenamiento y
# obligaba a reentrenar tres modelos para publicar un endpoint. La API consume
# el artefacto, no participa en producirlo, asi que no es dependencia de train.
stages:
  validate:
    cmd: python -m scripts.validate_data
    deps:
      - data/raw/train.csv
      - data/raw/test.csv
      - scripts/validate_data.py
      - src/config.py
      - src/data/load_data.py
    params:
      - data.target
    outs:
      - reports/data_validation.json:
          cache: false
  train:
    cmd: python main.py
    deps:
      - data/raw/train.csv
      - main.py
      - src/config.py
      - src/data
      - src/features
      - src/models
    params:
      - data
      - logistic_regression
      - random_forest
      - svm
      - selection
      - mlflow
    outs:
      - models/modelo_final.pkl
    metrics:
      - reports/metrics.json:
          cache: false
  predict:
    cmd: python -m scripts.predict
    deps:
      - data/raw/test.csv
      - models/modelo_final.pkl
      - scripts/predict.py
      - src/data/preprocessing.py
      - src/models/pipeline.py
    outs:
      - data/processed/predicciones.csv
  tune:
    cmd: python -m scripts.tune_hyperparameters
    deps:
      - data/raw/train.csv
      - scripts/tune_hyperparameters.py
      - src/config.py
      - src/data
      - src/models
    params:
      - data
      - logistic_regression
      - random_forest
      - svm
      - selection
      - mlflow
      - hyperparameter_search
    metrics:
      - reports/hyperparameter_search.json:
          cache: false
