stages:
  train:
    cmd: python main.py
    deps:
      - main.py
      - src/config.py
      - src/data/load_data.py
      - src/data/preprocessing.py
      - src/models/train.py
      - src/models/evaluate.py
      - src/models/pipeline.py
      - src/tracking/mlflow_tracker.py
      - data/raw/train.csv
    params:
      - split.test_size
      - split.random_state
      - split.target
      - modelos.metrica_seleccion
      - modelos.logistica.max_iter
      - modelos.random_forest.n_estimators
      - modelos.svm.kernel
      - modelos.svm.C
      - modelos.svm.gamma
    outs:
      - models/modelo_final.pkl
    metrics:
      - metrics/eval.json:
          cache: false
    plots:
      - plots/comparacion_modelos.csv:
          template: bar_horizontal
          x: f1
          y: modelo
          cache: false
      - plots/matriz_confusion.csv:
          template: confusion
          x: real
          y: prediccion
          cache: false
      - plots/importancias.csv:
          template: bar_horizontal
          x: importancia
          y: variable
          cache: false

  predict:
    cmd: python -m src.models.predict_batch
    deps:
      - src/models/predict_batch.py
      - src/config.py
      - src/data/load_data.py
      - src/data/preprocessing.py
      - src/models/pipeline.py
      - models/modelo_final.pkl
      - data/raw/test.csv
    outs:
      - data/processed/predicciones.csv