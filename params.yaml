data:
  target: price_range
  test_size: 0.20
  random_state: 42
logistic_regression:
  max_iter: 2000
random_forest:
  n_estimators: 300
  max_depth: null
  n_jobs: -1
svm:
  kernel: rbf
  C: 10.0
  gamma: scale
selection:
  metric: accuracy
mlflow:
  tracking_uri: sqlite:///mlflow.db
  experiment_name: telefonos_price_classification
  registered_model_name: TelefonosPriceClassifier
hyperparameter_search:
  logistic_regression:
    C: [0.1, 10.0]
  random_forest:
    trials:
      - n_estimators: 200
        max_depth: null
      - n_estimators: 300
        max_depth: 20
  svm:
    C: [1.0, 10.0]
