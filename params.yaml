# Hiperparámetros del proyecto. DVC vigila estos valores: al cambiarlos,
# `dvc repro` detecta que el modelo quedó obsoleto y lo reentrena.

split:
  test_size: 0.20
  random_state: 42
  target: "price_range"

modelos:
  metrica_seleccion: "accuracy"
  logistica:
    max_iter: 2000
  random_forest:
    n_estimators: 300
  svm:
    kernel: "rbf"
    C: 10.0
    gamma: "scale"
    
# Configuración de MLflow. Cambiar el nombre del
# experimento no debe invalidar el modelo entrenado.
mlflow:
  activo: true
  tracking_uri: "sqlite:///mlflow.db"
  experimento: "Mobile_Price_Classification_v1"
  registro_modelo: "Mobile_Price_Classifier"
  alias_produccion: "champion"