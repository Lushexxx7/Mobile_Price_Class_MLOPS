# Config de flake8. Va aqui porque flake8 no lee pyproject.toml.
[flake8]
# El mismo limite que black, si no se pelean entre ellos.
max-line-length = 100

# Estos dos chocan con black. Falso positivo conocido.
extend-ignore = E203, W503

exclude =
    .venv,
    .dvc,
    .git,
    __pycache__,
    notebooks,
    build,
    dist

per-file-ignores =
    # El import va a mitad del fichero a proposito: matplotlib.use("Agg")
    # tiene que ir antes.
    src/models/tracking.py:E402
