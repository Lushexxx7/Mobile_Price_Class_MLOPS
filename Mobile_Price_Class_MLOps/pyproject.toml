[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "mobile_price_classification"
version = "0.0.1"
description = "Mobile phone price range classification"
authors = [
  { name = "Yesica Sanchez" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = "~=3.11.0"


[tool.ruff]
line-length = 99
src = ["mobile_price_classification"]
include = ["pyproject.toml", "mobile_price_classification/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["mobile_price_classification"]
force-sort-within-sections = true

